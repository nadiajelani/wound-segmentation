[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woundseg"
version = "1.0.0"
description = "AI-powered wound segmentation and analysis system for medical applications"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Wound Segmentation Team", email = "contact@woundseg.ai"}
]
maintainers = [
    {name = "Wound Segmentation Team", email = "contact@woundseg.ai"}
]
keywords = [
    "medical-ai",
    "wound-segmentation", 
    "computer-vision",
    "deep-learning",
    "healthcare",
    "tensorflow",
    "keras",
    "unet"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.8"
dependencies = [
    # Core ML/AI
    "tensorflow>=2.15.0,<2.16.0",
    "keras>=2.15.0,<3.0.0",
    "numpy>=1.21.0,<2.0.0",
    "opencv-python>=4.5.0,<5.0.0",
    "scikit-image>=0.19.0,<1.0.0",
    "scikit-learn>=1.0.0,<2.0.0",
    
    # Image processing
    "Pillow>=9.0.0,<11.0.0",
    "matplotlib>=3.5.0,<4.0.0",
    "seaborn>=0.11.0,<1.0.0",
    
    # Data handling
    "pandas>=1.3.0,<3.0.0",
    "h5py>=3.1.0,<4.0.0",
    
    # CLI and utilities
    "typer[all]>=0.7.0,<1.0.0",
    "rich>=12.0.0,<14.0.0",
    "python-dotenv>=0.19.0,<2.0.0",
    "click>=8.0.0,<9.0.0",
    
    # PDF generation
    "reportlab>=3.6.0,<5.0.0",
    "fpdf2>=2.5.0,<3.0.0",
    
    # Voice synthesis (optional)
    "gtts>=2.2.0,<3.0.0",
    "pygame>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
# Training dependencies
train = [
    "albumentations>=1.3.0,<2.0.0",
    "tensorboard>=2.10.0,<3.0.0",
    "wandb>=0.13.0,<1.0.0",
    "tqdm>=4.64.0,<5.0.0",
]

# Explainability dependencies  
explain = [
    "shap>=0.41.0,<1.0.0",
    "lime>=0.2.0,<1.0.0",
    "grad-cam>=1.4.0,<2.0.0",
]

# Synthetic data generation
synthetic = [
    "diffusers>=0.20.0,<1.0.0",
    "transformers>=4.25.0,<5.0.0",
    "accelerate>=0.20.0,<1.0.0",
    "torch>=1.13.0,<3.0.0",
    "torchvision>=0.14.0,<1.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "black>=22.0.0,<24.0.0",
    "isort>=5.10.0,<6.0.0",
    "flake8>=5.0.0,<7.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pre-commit>=2.20.0,<4.0.0",
]

# All optional dependencies
all = [
    "woundseg[train,explain,synthetic,dev]"
]

[project.urls]
Homepage = "https://github.com/woundseg/woundseg"
Documentation = "https://woundseg.readthedocs.io"
Repository = "https://github.com/woundseg/woundseg.git"
Issues = "https://github.com/woundseg/woundseg/issues"
Changelog = "https://github.com/woundseg/woundseg/blob/main/CHANGELOG.md"

[project.scripts]
ws = "cli.ws_cli:app"

[project.gui-scripts]
woundseg-gui = "woundseg.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["woundseg*", "cli*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
woundseg = [
    "config/*.yaml",
    "config/*.json", 
    "models/*.json",
    "templates/*.html",
    "static/*",
]

# Black code formatting
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | models
  | outputs
  | logs
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["woundseg", "cli"]
known_third_party = ["tensorflow", "keras", "numpy", "cv2", "sklearn", "matplotlib", "pandas", "typer", "rich"]

# MyPy type checking
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "keras.*", 
    "cv2.*",
    "sklearn.*",
    "matplotlib.*",
    "seaborn.*",
    "reportlab.*",
    "gtts.*",
    "pygame.*",
    "shap.*",
    "lime.*",
    "diffusers.*",
    "transformers.*",
    "torch.*",
    "torchvision.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config", 
    "--verbose",
    "--tb=short",
    "--cov=woundseg",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "golden: Golden image tests",
    "slow: Slow running tests",
    "gpu: Tests requiring GPU",
    "synthetic: Tests requiring synthetic data generation",
    "explain: Tests requiring explainability features",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:tensorflow.*",
    "ignore::UserWarning:keras.*",
]

# Coverage configuration
[tool.coverage.run]
source = ["woundseg", "cli"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/wound_seg_env/*",
    "*/models/*",
    "*/outputs/*",
    "*/logs/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]