services:
  - type: web
    name: wound-detection-api
    env: python
    buildCommand: pip install -r requirements_free.txt
    startCommand: python app_free.py
    envVars:
      - key: SECRET_KEY
        value: your-secret-key-here
      - key: PORT
        value: 10000
    disk:
      name: model-storage
      mountPath: /app/models
      sizeGB: 1