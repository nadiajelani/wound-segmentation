<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wound Whisperer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
  <style>
    :root {
      --primary: #3a5199;
      --secondary: #5ccdc9;
      --text: #333;
      --background: #f6f9fc;
      --accent: #ff6b6b;
      --white: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, rgba(92, 205, 201, 0.1) 0%, rgba(58, 81, 153, 0.3) 100%);
      color: var(--text);
      overflow-x: hidden;
      padding: 2rem;
      text-align: center;
      position: relative;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    .pulse-circle {
      position: absolute;
      background-color: rgba(92, 205, 201, 0.3);
      border-radius: 50%;
      transform-origin: center;
      z-index: -1;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .submit-btn, .btn-primary {
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      color: var(--white);
      border: none;
      border-radius: 50px;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(58, 81, 153, 0.4);
      transition: all 0.3s ease;
    }

    .submit-btn:hover, .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(58, 81, 153, 0.5);
    }

    .form-control {
      max-width: 400px;
      margin: 1rem auto;
    }

    .form-check-label {
      margin-left: 0.5rem;
    }

    .output {
      margin-top: 2rem;
      display: none;
    }

    #reportLink {
      display: none;
      margin-top: 1rem;
    }

    #originalPreview, #maskPreview {
      max-width: 300px;
      margin-top: 1rem;
      border-radius: 8px;
      display: none;
    }

    #loadingSpinner {
      display: none;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <h1>Wound Whisperer</h1>
  <p>Upload a wound image and receive a clinical analysis report.</p>

  <div class="form-check form-switch text-center mt-3">
    <input class="form-check-input" type="checkbox" id="medsamToggle">
    <label class="form-check-label" for="medsamToggle">Use MedSAM (Advanced Segmentation)</label>
  </div>
  <div class="form-check form-switch text-center mt-2">
    <input class="form-check-input" type="checkbox" id="voiceSummaryToggle">
    <label class="form-check-label" for="voiceSummaryToggle">Enable Voice Summary</label>
  </div>

  <input type="file" id="imageInput" accept="image/*" class="form-control">
  <button onclick="handleUpload()" class="submit-btn">Upload and Analyze</button>

  <div id="loadingSpinner">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Processing...</p>
  </div>

  <img id="originalPreview" alt="Original Image Preview">
  <img id="maskPreview" alt="Segmentation Mask Preview">

  <div class="output" id="resultBox">
    <a id="openReportPage" href="#" target="_blank" class="btn btn-primary" style="display:none; margin-top: 0.5rem;">Open Report Page</a>
    <audio id="voiceSummary" controls style="display: none; margin-top: 1rem;"></audio>
    <h4 id="severity"></h4>
    <h5 id="healing"></h5>
    <p id="area"></p>
    <a id="reportLink" href="#" target="_blank" class="btn btn-success">Download PDF Report</a>
  </div>

  <div class="mt-4">
    <a href="wound-wisperer.html" class="btn btn-outline-primary me-2" target="_blank">Go to Main Page</a>
    <a href="/reports" class="btn btn-outline-secondary" target="_blank">Browse All Reports</a>
  </div>

  <script>
    function handleUpload() {
      const fileInput = document.getElementById("imageInput");
      if (!fileInput.files.length) {
        alert("Please select an image.");
        return;
      }
    
      const formData = new FormData();
      formData.append("image", fileInput.files[0]);
      formData.append("use_medsam", document.getElementById("medsamToggle").checked ? "true" : "false");
      formData.append("voice_summary", document.getElementById("voiceSummaryToggle").checked ? "true" : "false");
    
      document.getElementById("loadingSpinner").style.display = "block";
      document.getElementById("resultBox").style.display = "none";
      document.getElementById("reportLink").style.display = "none";
    
      fetch("https://wound-detection-uqdl.onrender.com", {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          alert("Error: " + data.error);
          return;
        }
    
        document.getElementById("severity").innerText = `Severity: ${data.severity}`;
        document.getElementById("healing").innerText = `Healing Potential: ${data.healing_potential}`;
        document.getElementById("area").innerText = `Wound Area: ${data.area_mm2.toFixed(2)} mm²`;
    
        const reportLink = document.getElementById("reportLink");
        reportLink.href = data.pdf_url;
        reportLink.style.display = "inline-block";
    
        const reportPage = document.getElementById("openReportPage");
        reportPage.href = data.pdf_url;
        reportPage.style.display = "inline-block";
    
        if (data.image_base64) {
          const original = document.getElementById("originalPreview");
          original.src = "data:image/png;base64," + data.image_base64;
          original.style.display = "block";
        }
        if (data.mask_base64) {
          const mask = document.getElementById("maskPreview");
          mask.src = "data:image/png;base64," + data.mask_base64;
          mask.style.display = "block";
        }
    
        document.getElementById("resultBox").style.display = "block";
    
        if (data.voice_summary_url) {
          const audioPlayer = document.getElementById("voiceSummary");
          audioPlayer.src = data.voice_summary_url;
          audioPlayer.style.display = "block";
        }
      })
      .catch(err => {
        console.error(err);
        alert("Upload failed. Please try again.");
      })
      .finally(() => {
        document.getElementById("loadingSpinner").style.display = "none";
      });
    }
    
    // Particle background like main page
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;
    const renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);
    
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCnt = 1000;
    const posArray = new Float32Array(particlesCnt * 3);
    for (let i = 0; i < particlesCnt * 3; i++) {
      posArray[i] = (Math.random() - 0.5) * 10;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMaterial = new THREE.PointsMaterial({ size: 0.02, color: 0x5ccdc9, transparent: true, opacity: 0.8 });
    const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particlesMesh);
    
    function animate() {
      requestAnimationFrame(animate);
      particlesMesh.rotation.x += 0.0003;
      particlesMesh.rotation.y += 0.0005;
      renderer.render(scene, camera);
    }
    animate();
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    document.addEventListener('mousemove', (event) => {
      const x = (event.clientX / window.innerWidth) - 0.5;
      const y = (event.clientY / window.innerHeight) - 0.5;
      gsap.to(particlesMesh.rotation, { x: y * 0.2, y: x * 0.2, duration: 2 });
    });
    </script>
