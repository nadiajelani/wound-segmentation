services:
  - type: web
    name: wound-whisperer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    env: python
    plan: free
    region: oregon
    buildFilter:
      paths:
        - .
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
